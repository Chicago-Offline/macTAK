# Tier 1 per docs/ci-qa.md: native-engine PR gate, comms-stack gate, JVM
# kernel tests, shell/workflow lint.
#
# `src/` is local-only (gitignored): CI materializes the upstream ATAK CIV tree at
# the same pinned commit the local build uses. dev/g1/build-native.sh runs
# verbatim — one canonical build path, no CI-specific forks.

# Runs on every pull_request (no paths filter) so the main ruleset's required
# CI checks — "native engine (macOS arm64)", "JVM tests (Zulu 8, macOS arm64)",
# "lint (shell + workflows)" — always report. With paths-ignore, docs-only PRs
# never trigger this workflow and those required checks are stuck at
# "Expected" forever — the same gap the docs workflow closed in PR #12
# (see docs.yml's header comment).
#
# The heavy steps no-op when a PR has no CI-relevant changes: the `changes`
# job diffs the PR against its base and the steps run only on a match.
# This must stay at step level — a job-level `if` skips the whole job,
# which reports "skipped", and a skipped check does not satisfy a required
# check (same trap as above, one level down).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  # Manual runs stay available for spot checks; no longer needed to fill
  # required checks now that pull_request triggers unconditionally.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect CI changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff against the PR base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Non-PR runs (push with matching paths, dispatch): always run the gates.
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # Three-dot diff = PR's own changes. dev/ covers the engine, comms and
          # JVM gates and their scripts; .github/workflows covers this file and
          # the pinned upstream commit; Makefile wraps the build entry points.
          # A diff failure fails the job loudly rather than silently skipping.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'dev' '.github/workflows' 'Makefile')
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CI-relevant changes vs ${BASE_REF} — heavy steps will skip"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  native-engine:
    name: native engine (macOS arm64)
    needs: changes
    runs-on: macos-26 # Xcode 26 toolchain — matches the verified local build; Xcode 15 (macos-14) fails on old libc++ pair constraints
    timeout-minutes: 60
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out upstream ATAK CIV at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deptofdefense/AndroidTacticalAssaultKit-CIV
          ref: 889eee292c43d3d2eafdd1f2fbf378ad5cd89ecc # keep in sync with local src/ (docs/ci-qa.md)
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Install engine dependencies (Homebrew)
        if: needs.changes.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        # + the build-commo.sh preflight list: the layer canary below runs
        # atak-headless, which is one JVM with both stacks since G1.4.
        run: >
          brew install cmake rsync proj geos gdal libspatialite minizip nlohmann-json laszip googletest
          openssl@3 libxml2 protobuf libmicrohttpd curl

      - name: Set up Zulu 8 (arm64) for the JNI smoke canary
        # build-native.sh itself needs no JDK (jni.h is pinned at
        # dev/g1/jdk-include) but its final canary loads the engine in a
        # JVM (dev/g1/smoke/run.sh).
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64

      - name: Build engine + canary (dev/g1/build-native.sh, verbatim)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-native.sh

      - name: Build comms stack (dev/g1/build-commo.sh, verbatim)
        # atak-headless loads libcommoncommo(jni) alongside the engine; the
        # commo-stack job below is the gate for this build, this is its consumer.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-commo.sh

      - name: atak-headless offline layer open (GeoJSON/GPKG/KML/SHP via FeatureDataStore2)
        # G1 "offline map layer opens": native OGR provider parses the
        # fixture (+ ogr2ogr-derived GPKG/KML/SHP), the persistent feature
        # data store holds it, FeatureDataStore2 cursors read it back.
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/headless/test/layer.sh

      - name: Upload engine artifacts
        # Guarded: if-no-files-found is error, which would fail a no-op run.
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-engine-macos-arm64
          path: |
            dev/g1/native-dist/libtakengine.dylib
            dev/g1/native-dist/libtakenginejni.dylib
            dev/g1/native-dist/libGLESv2-stub.dylib
            dev/g1/native-dist/takengine-tests.xml
          if-no-files-found: error

  commo-stack:
    name: comms stack (macOS arm64)
    needs: changes
    runs-on: macos-26 # Xcode 26 toolchain — matches the verified local build
    timeout-minutes: 30
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out upstream ATAK CIV at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deptofdefense/AndroidTacticalAssaultKit-CIV
          ref: 889eee292c43d3d2eafdd1f2fbf378ad5cd89ecc # keep in sync with local src/ (docs/ci-qa.md)
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Install comms dependencies (Homebrew)
        # build-commo.sh preflight list; protoc ships with protobuf
        if: needs.changes.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install openssl@3 libxml2 protobuf libmicrohttpd curl

      - name: Set up Zulu 8 (arm64) — javah for the JNI glue + load canary
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64

      - name: Build comms stack + canaries (dev/g1/build-commo.sh, verbatim)
        if: needs.changes.outputs.changed == 'true'
        run: bash dev/g1/build-commo.sh

      - name: Upload comms artifacts
        # Guarded: if-no-files-found is error, which would fail a no-op run.
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commo-stack-macos-arm64
          path: |
            dev/g1/native-dist/libcommoncommo.dylib
            dev/g1/native-dist/libcommoncommojni.dylib
            dev/g1/native-dist/jcommoncommo.jar
          if-no-files-found: error

  jvm-tests:
    name: JVM tests (Zulu 8, macOS arm64)
    needs: changes
    runs-on: macos-26 # matches the locally verified macOS/Zulu 8 arm64 environment
    timeout-minutes: 40
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out upstream ATAK CIV at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deptofdefense/AndroidTacticalAssaultKit-CIV
          ref: 889eee292c43d3d2eafdd1f2fbf378ad5cd89ecc
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Set up Zulu 8 (arm64)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64
          cache: gradle

      - name: Install android-port transplant to mavenLocal
        # gov.tak.support:android-port is TAK-artifactory-only; G0 built a
        # compile-only transplant (see dev/spike/g0/NOTES.md §3). CI installs
        # the committed jar so the G0 patch's mavenLocal repo resolves it.
        if: needs.changes.outputs.changed == 'true'
        run: mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file
          -Dfile=dev/spike/g0/transplants/android-port-3.1.0.jar
          -DpomFile=dev/spike/g0/transplants/android-port-3.1.0.pom

      - name: Apply G0 public-source build patch
        if: needs.changes.outputs.changed == 'true'
        run: patch -d src -p1 --forward < dev/spike/g0/patches/gradle-public-source-build.patch

      - name: Apply G0 shared-test patch (commons-math3 + runtime-stub test exclusion)
        if: needs.changes.outputs.changed == 'true'
        run: patch -d src -p1 --forward < dev/spike/g0/patches/gradle-shared-test-deps.patch

      - name: Kernel tests + publishToMavenLocal
        if: needs.changes.outputs.changed == 'true'
        working-directory: src/takkernel
        run: ./gradlew --no-daemon :shared:test :port:test publishToMavenLocal

      - name: Upload test reports
        if: always() && needs.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-reports
          # G0 patch relocates Gradle build dirs under build/java/
          path: |
            src/takkernel/shared/build/java/reports/tests/
            src/takkernel/port/build/java/reports/tests/
            src/takkernel/shared/build/java/test-results/test/
            src/takkernel/port/build/java/test-results/test/
          if-no-files-found: warn

  lint:
    name: lint (shell + workflows)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out macTAK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (all workflow files)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: shellcheck + bash -n (dev/**/*.sh)
        if: needs.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          scripts=(dev/**/*.sh dev/g1/headless/atak-headless) # launcher has no .sh suffix
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "error: no scripts matched dev/**/*.sh" >&2
            exit 1
          fi
          shellcheck "${scripts[@]}"
          for s in "${scripts[@]}"; do bash -n "$s"; done
          echo "lint OK: ${#scripts[@]} script(s)"